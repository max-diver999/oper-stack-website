<?xml version="1.0" encoding="UTF-8"?>
<!--
  Значок отправителя в списке писем.

  Почтовые службы показывают логотип компании вместо кружка с буквой, если домен объявил его
  записью BIMI и письма проходят DMARC строже, чем «наблюдаем». И то и другое у нас с 16.09.2026
  есть. Формат жёсткий: SVG Tiny PS, квадрат, обязательный заголовок, никаких скриптов, шрифтов
  и внешних ссылок, поэтому это отдельный файл, а не тот же favicon.svg.

  Фон залит на весь квадрат намеренно: почтовые программы сами обрезают значок в круг, и скруглять
  углы заранее незачем, иначе по краям появятся тёмные уголки.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 32 32" width="32" height="32">
  <title>OperStack</title>
  <rect width="32" height="32" fill="#0B1017"/>
  <rect x="6" y="7.5" width="20" height="4.5" rx="2.25" fill="#3DB8A9"/>
  <rect x="6" y="13.75" width="20" height="4.5" rx="2.25" fill="#3DB8A9"/>
  <rect x="6" y="20" width="20" height="4.5" rx="2.25" fill="#E8B84A"/>
</svg>
